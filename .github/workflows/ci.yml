name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3000
  DATABASE_URL: postgres://uyut:uyut@localhost:5432/uyut
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: local-dev-token
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: ru-1
  S3_BUCKET: uyut-dev
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
  SMTP_URL: smtp://127.0.0.1:1025
  EMAIL_FROM: Uyut <hello@uyut.local>
  MAILPIT_URL: http://localhost:8025

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Start services
        run: |
          docker compose up -d --wait postgres redis redis-http minio mailpit
          docker compose up minio-init

      - name: Migrate test database
        run: bun run db:migrate

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run e2e

      - name: Stop services
        if: always()
        run: docker compose down -v
