name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_URL: http://localhost:3000
  DATABASE_URL: postgres://uyut:uyut@localhost:5432/uyut
  UPSTASH_REDIS_REST_URL: http://localhost:8079
  UPSTASH_REDIS_REST_TOKEN: ci
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: ru-1
  S3_BUCKET: uyut-ci
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: uyut
          POSTGRES_PASSWORD: uyut
          POSTGRES_DB: uyut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uyut -d uyut"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Migrate test database
        run: bun run db:migrate

      - name: Install Playwright
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke
        run: bun run e2e
