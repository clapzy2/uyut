# Redis и REST-прокси к нему как один ресурс Coolify (тип Docker Compose).
# Переменные REDIS_PASSWORD и SRH_TOKEN задаются в Coolify. Адрес для приложения
# смотри в README: короткое имя redis-http доступно только внутри самого сервиса.

services:
  # Имя не redis: в общей сети coolify этот псевдоним уже занят внутренним Redis панели,
  # и прокси уходил бы авторизовываться в чужую базу.
  uyut-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      # Имя пользователя обязательно: без него клиент шлёт AUTH с пустым именем, и Redis 7
      # отвечает WRONGPASS, хотя пароль верный.
      SRH_CONNECTION_STRING: redis://default:${REDIS_PASSWORD}@uyut-redis:6379
    depends_on:
      uyut-redis:
        condition: service_healthy

volumes:
  redis-data:
