name: uyut

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: uyut
      POSTGRES_PASSWORD: uyut
      POSTGRES_DB: uyut
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uyut -d uyut"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # REST-интерфейс поверх Redis, совместимый с Upstash: клиенты @upstash/* ходят сюда
  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  # Локальное S3-хранилище. Публичный образ MinIO больше недоступен для CI без авторизации.
  s3:
    image: ghcr.io/chrislusf/seaweedfs:4.47
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: uyut-dev
    ports:
      - "9000:8333"
    volumes:
      - seaweed-data:/data

  # Ловит все исходящие письма в dev: SMTP на 1025, веб-интерфейс и API на 8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      # Без обратного DNS: в Docker Desktop он висит секунды на каждом письме
      MP_SMTP_DISABLE_RDNS: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  seaweed-data:
